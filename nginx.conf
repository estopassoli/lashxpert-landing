server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/otf;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|jpe?g|png|webp|svg|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
